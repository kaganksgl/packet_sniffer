<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <clipPath id="inside">
      <circle cx="26" cy="26" r="15"/>
    </clipPath>
  </defs>

  <!-- glass body: captured bytes, read as hex-dump rows -->
  <circle cx="26" cy="26" r="15.5" fill="#0f172a"/>
  <g clip-path="url(#inside)" fill="#e2e8f0">
    <rect x="11" y="15.5" width="11" height="4.5" rx="2.25" opacity=".9"/>
    <rect x="25" y="15.5" width="7"  height="4.5" rx="2.25" opacity=".55"/>
    <rect x="35" y="15.5" width="9"  height="4.5" rx="2.25" opacity=".75"/>

    <rect x="9"  y="23.75" width="7"  height="4.5" rx="2.25" opacity=".5"/>
    <rect x="19" y="23.75" width="13" height="4.5" rx="2.25" fill="#5eead4"/>
    <rect x="35" y="23.75" width="8"  height="4.5" rx="2.25" opacity=".8"/>

    <rect x="11" y="32" width="9"  height="4.5" rx="2.25" opacity=".75"/>
    <rect x="23" y="32" width="6"  height="4.5" rx="2.25" opacity=".45"/>
    <rect x="32" y="32" width="11" height="4.5" rx="2.25" opacity=".85"/>
  </g>

  <!-- magnifier ring and handle -->
  <circle cx="26" cy="26" r="15.5" fill="none" stroke="url(#lens)" stroke-width="5"/>
  <path d="M37.5 37.5 L53 53" stroke="url(#lens)" stroke-width="7.5" stroke-linecap="round"/>
</svg>
